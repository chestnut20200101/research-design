: "2025-04-30", "volume": "19(1)", "pages": "59–75", "doi": "10.57698/v19i1.04", "url": "https://www.ijdesign.org/index.php/IJDesign/article/view/5344/1097", "image_url": "https://www.ijdesign.org/public/journals/1/5344/Figure5.jpg", "image_label": "Figure 5 · 车间中的整理与展示", "lead": "同一篇论文，既可以解释人们如何设计，也可以为未来设计提供依据。争议来自分类维度的交叉，不一定来自“第四类”的缺席。", "background": "工人为适应真实任务而改造工具与工作环境，这种非专业、非正式设计往往不被看见。文章关注这些自发设计如何形成，以及它们怎样为工业工作设备设计提供知识。", "method": "作者走访葡萄牙 11 家工业单位，采用非参与观察、情境询问、实物与照片分析及亲和图整理；记录 205 个自发设计实例，并与可确认的 14 位创造者交流。205 是实例数，不是被试数。", "role": "工人的设计行为既是解释对象，也成为未来专业设计的经验资源。研究者主要记录和分析，并非组织一轮共同制作来产生研究制品。", "contribution": "文章整理改造类型，并从用途、行动与价值等维度解释自发设计，为更合适的工作设备提出设计启示。", "judgment": "采用多维口径，我们保留 Into × For：解释设计活动与支持未来设备设计均有明确依据。采用主导贡献口径，Into 为主也成立。交叉不是唯一正确答案，也不表示两类权重相等。", "counter": "争议的关键不是“车间里有没有制作”，而是“谁在制作、谁在研究，以及论文靠什么证据形成什么贡献”。", "author_limit": "样本来自葡萄牙，未能确认所有实例的创造者，各行业纳入工厂数量也不同，不能据此简单比较哪个行业更有创造力。", "analytic_limit": "分析性局限：设计启示尚不等于完成设备再设计后的效果验证；工人的制作活动不能直接替代本篇论文需要说明的研究方法。", "metrics": [["11", "工业单位"], ["205", "自发设计实例"], ["14", "可确认创造者"]], "visual_caption": "阅读示意｜依据 Methods、Findings 与 Table 5 绘制证据结构；工具图形为通用示意，不是论文中的具体实物。", "evidence": [{"loc": "Introduction｜研究缺口与目标", "find": "inform the design of appropriate", "fact": "作者把理解自发设计与为合适、安全、包容的工业设备设计提供知识联系起来。", "supports": "For 有明确依据，但这并不排除研究同时解释设计现象。"}, {"loc": "Methods｜观察与情境询问", "find": "free non-participant observation", "fact": "作者通过非参与观察与情境询问记录已存在的车间改造。", "supports": "为 Into 的解释性路径提供依据；也限制“看到制作就算 Through”的推断。"}, {"loc": "Findings；Discussion｜Table 5", "find": "Table 5", "fact": "用途、行动与价值构成对自发设计的分析性整理。", "supports": "知识超出个别实物描述，但仍与未来的设计支持紧密相连。"}, {"loc": "Context and Participants；Findings；研究局限", "find": "we cannot conclude that one sector", "fact": "工厂数、创造者数与实例数是不同单位；行业样本数量不等。", "supports": "防止样本单位混淆与不当排名，限定分类讨论的经验基础。"}], "short": "工业车间里的自发设计", "author_short": "Correia de Barros 等", "research_question": "工业车间的工人为什么、怎样改造工作物件；这些自发设计如何为未来设备设计提供依据？", "class_link": "对应课堂 2.4 关于类型无明确隔阂的提醒：本篇同时解释既有设计活动，并把结果转成对未来设计的支持。", "caption": "从工人改造到研究分析，再到设计启示。分析结构依据：Methods / Findings / Table 5。", "visual_tabs": [["工人的设计", "为适应真实任务，改造工具与工作环境。"], ["研究者的分析", "观察、询问并解释已经存在的改造。"], ["面向后续设计", "把分析结果转化为工作设备设计的经验来源。"]], "cover": "debate-5"}], "courses": [{"id": "c21", "title": "知识点 2.1：对设计的研究 Research into Design", "url": "https://icnw85hd2glo.feishu.cn/wiki/ZpevwJA3PiYcHTkjXizcaAUynyf", "summary": "课堂将核心产出表述为“理解”，并按内部、外部和时间视角展开；首图强调从具体问题，经材料与分析，形成有边界的解释。", "quote": "Into把设计活动、制品及其文化和制度关系作为研究对象。"}, {"id": "c22", "title": "知识点 2.2：为设计的研究 Research for Design", "url": "https://icnw85hd2glo.feishu.cn/wiki/DMJ1w6mosi3NWVkBAuicPjj4npc", "summary": "课堂强调服务设计目标、直接指导实践、设计实践的目的高于纯粹研究目的，以及以证据提高结果可靠性。", "quote": "为设计的研究就是要解决设计过程规范化、提高结果的可靠性。"}, {"id": "c23", "title": "知识点 2.3：通过设计的研究", "url": "https://icnw85hd2glo.feishu.cn/wiki/TeYpwlEuoi5UcXks8vEcwXIunBf", "summary": "从设计实践形成知识贡献；讨论过程、发明性、相关性、可延展性，以及知识的情境性与多样性。", "quote": "通过参与设计过程、分析设计输出，以产生知识。"}, {"id": "c24", "title": "知识点 2.4：三种设计研究的关系", "url": "https://icnw85hd2glo.feishu.cn/wiki/VIkBwm92hi3XFkkCJWlcPLzTnUf", "summary": "三种取向没有规定的起点和顺序；分类困难可能来自交叉、术语差异、资料不足或框架遗漏。", "quote": "三种设计研究不是全部，三种设计研究之间也没有明确的隔阂！"}, {"id": "venues", "title": "浙江大学设计学高影响力期刊和会议列表（2021版，2022年1月修订）", "pages": "p.1", "url": "", "summary": "International Journal of Design 列于 A 类期刊。本文四篇研究均选自该刊的 2025 年正式发表论文。", "quote": ""}], "figures": [{"key": "into-1", "file": "data:image/webp;base64,UklGRs4ZAABXRUJQVlA4IMIZAAAwcQCdASpeAeoAPpVEnUslo6MhpjPbGLASiWVu4WlxVXv/GUxvZJs5Rv+2TId+snvL8p7oTfsB6gP2M9ZL/Sepj/I+oB/Wuok9BH9t/Tm9kn90f3S9sbVV/J3927V/7n+S3nv+KfPP3n+y/tt/dvSZ8dPO//I/uXqV/HPr197/tf7o/4f3u/zPhL8H/5j8u/698gX5N/Lv7p+av9+9MfZt6d/sP8j6gvqP89/0X9+/cP/PehX/Vf1P1i+tH+i9wD+Tfyj/Z+r3+w8Ez7d/yP9h7gX8z/s3+9/u/5NfSn/I/9z/Jfm57XPz3/Cf9r/GfAN/J/63/xf8N+VPhO9Gj94TDXG6BJBpcfkxBWtOLQTWXfpWuxu3WlNBeMA9QT4YYR7c11N+qISrOM9zq/W/i5Wib7ODKw5tsZfxfwZTnYvh9Bp9kBrqtnUzVVuDsEZRJSTI4WUv9Cy54I5QTgu/cSsDCB5BipeL4fQafZAa8zohJccldeIKiL6j1dzLptBqyWAIRFsAoFAJ17x6dqqnrgUDvnYvh9Bp9kBrr6lnq9Ay3udit2R/+qbHbRq6W28bqznK6vvB5Feh0NPsfe6 </script><script>'use strict';
const D=window.RESEARCH_DATA;
const $=(s,root=document)=>root.querySelector(s);
const $$=(s,root=document)=>Array.from(root.querySelectorAll(s));
const escapeHTML=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const E=escapeHTML;
const theory=id=>D.theories.find(t=>t.id===id);
const paper=id=>D.papers.find(p=>p.id===id);
const arrow='<span aria-hidden="true">↗</span>';
const sourceLink=(p,find='')=>p.url+(find?'#:~:text='+encodeURIComponent(find):'');
const external=(url,label,cls='text-link')=>location.hash!=='#references'?'':`<a class="${cls}" href="${E(url)}" target="_blank" rel="noopener noreferrer">${label} ${arrow}</a>`;
const typeLabel=(id,label)=>`<span class="type-label ${id}">${E(label||paper(id)?.type||id)}</span>`;
const routeLink=(route,label,cls='text-link')=>`<a href="#${route}" class="${cls}">${label} ${arrow}</a>`;
const asset=id=>D.figures.find(f=>f.key===id);
function figure(key,cls='',lazy=true){
 const f=asset(key);if(!f)return '';
 return `<figure class="figure ${cls}"><button type="button" class="image-button" data-zoom="${f.key}" aria-label="放大：${E(f.title)}"><img src="${E(f.file)}" alt="${E(f.alt||f.title)}" ${lazy?'loading="lazy"':''} width="${f.width}" height="${f.height}"></button><figcaption class="caption">${E(f.title)}。${external(f.source,`${E(f.credit)} · ${E(f.position)}`,'caption-link')}</figcaption></figure>${location.hash.startsWith('#paper/')?figureAnalysis(key):''}`;
}
function pageHeader(title,desc,kicker='',action=''){return `<header class="page-heading"><div>${kicker?`<p class="kicker">${kicker}</p>`:''}<h1>${title}</h1><p>${desc}</p></div>${action?`<div class="actions">${action}</div>`:''}</header>`;}
function subnav(which){return `<nav class="subnav" aria-label="研究取向内页"><a href="#types" class="${which==='types'?'active':''}" ${which==='types'?'aria-current="page"':''}>三种取向</a><a href="#relations" class="${which==='relations'?'active':''}" ${which==='relations'?'aria-current="page"':''}>关系与反馈</a></nav>`;}
function paperCard(p){const f=asset(p.cover);return `<article class="paper-item ${p.id}"><a href="#${p.id==='debate'?'challenge':'paper/'+p.id}"><div class="preview"><img src="${f.file}" alt="${E(f.title)}" loading="lazy" width="${f.width}" height="${f.height}"></div><div class="meta">${typeLabel(p.id,p.id==='debate'?'分类讨论':p.type)}<span>2025 · ${E(p.volume)}</span></div><h3>${E(p.short)}</h3><p>${E(p.research_question)}</p><div class="paper-footer"><span>${E(p.author_short)}</span><span>${p.id==='debate'?'先看研究线索':'论文精读'} ↗</span></div></a></article>`;}
function home(){return `<div class="wrap page"><section class="home-hero"><div class="home-intro"><p class="kicker">设计研究的三种取向</p><h1>设计，<br>如何成为<span>研究</span>？</h1><p>解释设计如何发生，为设计提供依据，或在设计实践中形成新认识。同样面对设计，研究的问题与贡献可以很不同。</p><div class="actions">${routeLink('types','理解三种取向','button primary')}${routeLink('papers','从论文开始')}</div></div><div class="hero-academic" aria-label="三种研究取向"><div class="hero-academic-inner"><div class="hero-academic-head"><h2>研究取向</h2><span>Research orientation</span></div>${D.theories.map((t,i)=>`<a href="#types" class="hero-academic-row ${t.id}"><span class="row-index">0${i+1}</span><div class="row-name"><span class="serif">${t.name}</span></div><div class="row-copy"><h3>${t.zh}</h3><p>${t.role}</p></div><span class="row-arrow" aria-hidden="true">↗</span></a>`).join('')}</div></div></section><section class="rule-section"><div class="section-head"><div><h2>把概念放回论文里</h2><p>看研究对象、证据路径与知识贡献怎样对应。</p></div>${routeLink('compare','并排比较三篇论文')}</div><div class="paper-list">${D.papers.slice(0,3).map(paperCard).join('')}</div></section><section class="debate-banner"><img class="banner-img" src="${asset('debate-5').file}" alt="工人自制的工具存放和展示装置" loading="lazy"><div class="banner-copy"><p class="kicker">分类讨论</p><h2>工人在做设计，<br>研究者在做什么？</h2><p>一项关于工业车间的研究，记录了 205 个自发设计实例。看见了“制作”，是否就足以判断它属于 Through？</p>${routeLink('challenge','阅读线索，作出你的判断','button')}<p class="caption">图：Correia de Barros 等，2025，Figure 5。</p></div></section></div>`;}
function types(){return `<div class="wrap page">${pageHeader('设计在研究中，扮演什么角色？','从研究目的、设计角色和知识贡献三个维度理解差异。方法可以重叠，分类取决于它们如何共同回答研究问题。','研究取向')}${subnav('types')}<section class="concept-table">${D.theories.map(t=>`<article class="concept-column ${t.id}"><header><h2>${t.name}</h2><h3>${t.zh}</h3></header><dl><dt>研究目的</dt><dd>${E(t.purpose)}</dd><dt>设计的角色</dt><dd class="short-role">${E(t.role)}</dd><dt>主要知识贡献</dt><dd>${E(t.knowledge)}</dd><dt>判断时留意</dt><dd>${E(t.boundary)}</dd></dl>${routeLink('paper/'+t.id,'在论文中看 '+t.name)}</article>`).join('')}</section><aside class="concept-note"><strong>同样访谈，同样做原型，<br>为什么分类不同？</strong><p>访谈、实验和制作本身不能直接对应一种取向。还需追问：研究在解释什么？设计是否服务于后续决策？新的认识是否依赖具体的设计实践而形成？</p></aside><section class="rule-section"><div class="section-head"><h2>课堂中的三个切入点</h2>${routeLink('relations','看三者怎样相互联系')}</div><div class="course-examples">${D.theories.map(t=>`<article>${figure('course-'+t.id)}<h3>${t.verb}</h3><p>${t.course_example}</p>${external(D.courses.find(c=>c.id==='c2'+({into:1,for:2,through:3}[t.id])).url,'阅读课堂章节')}</article>`).join('')}</div></section>${criteriaBlock()}</div>`;}
function collection(){return `<div class="wrap page collection">${pageHeader('四篇论文，四条证据路径','三篇典型实例与一篇分类争议，均发表于 International Journal of Design（2025）。归类是结合课程框架作出的分析判断。','论文阅读',routeLink('compare','并排比较','button'))}<div class="paper-list">${D.papers.map(paperCard).join('')}</div></div>`;}
const dimensions=[['research_question','研究问题'],['method','研究方法'],['role','设计角色'],['contribution','知识贡献'],['judgment','分类理由']];
let compareDimension='research_question';
function compareCells(){return D.papers.slice(0,3).map(p=>{const ix={research_question:0,method:1,role:1,contribution:2,judgment:2}[compareDimension],e=p.evidence[ix];return `<article class="compare-cell ${p.id}">${typeLabel(p.id)}<h2>${p.short}</h2><img src="${asset(p.cover).file}" alt="${E(asset(p.cover).title)}"><p>${E(p[compareDimension])}</p><div class="evidence"><strong>对应原文依据</strong><p>${E(e.fact)}</p>${external(sourceLink(p,e.find),E(e.loc),'text-link')}</div>${routeLink('paper/'+p.id,'阅读全文')}</article>`;}).join('');}
function compare(){return `<div class="wrap page">${pageHeader('同一个维度，并排看清差异','切换比较维度，三篇论文保持在同一位置。比较研究问题、方法、角色、贡献与分类理由。','对照阅读',routeLink('papers','返回论文集合'))}<div class="compare-controls" role="group" aria-label="选择比较维度">${dimensions.map(([key,name])=>`<button data-compare="${key}" aria-pressed="${key===compareDimension}">${name}</button>`).join('')}</div><div class="compare-grid" id="compare-grid" aria-live="polite">${compareCells()}</div><aside class="concept-note"><strong>判断主导取向</strong><p>看论文主要希望贡献什么，以及证据如何支持这种贡献。相同的方法、同样出现的制品，可能服务于不同的知识诉求。</p></aside></div>`;}
const processes={into:[['材料','项目回顾访谈','10 位学术设计研究者'],['分析','编码与主题分析','理解理论使用的实践'],['贡献','描述性概念框架','解释理论怎样成为材料']],for:[['材料','三项既有研究','不同情境与证据类型'],['综合','连接经验与理论','梳理嗅觉体验的设计考虑'],['贡献','原则与框架','支持后续故事设计']],through:[['前期基础','已有研究制品','制作过程见 2024 年工作'],['本篇研究','家庭部署与分析','8 个家庭，约两周，三次访问'],['本篇贡献','体验认识与方法','功能、时间性与材料性的联系']],debate:[['对象','工人的自发改造','11 家工业单位，205 个实例'],['分析','观察与情境询问','照片、实物及亲和图整理'],['贡献','解释与设计启示','连接现象认识和后续设计']]};
function processDiagram(id){return `<div class="process-strip" aria-label="本篇研究的证据路径">${processes[id].map(([label,title,desc])=>`<div><small>${label}</small><strong>${title}</strong><p>${desc}</p></div>`).join('')}</div><p class="caption">本组根据论文方法与结果整理。箭头表示论证路径，不代表三类研究的固定先后顺序。</p>`;}
function evidenceSet(p){return `<div class="evidence-set">${p.evidence.map((e,i)=>`<details ${i===0?'open':''}><summary><strong>${String(i+1).padStart(2,'0')}</strong> · ${E(['问题与目标','材料与方法','发现与贡献','边界与局限'][i])}</summary><p class="source-location">${E(e.loc)}</p><p>${E(e.fact)}</p><p><strong>支持判断：</strong>${E(e.supports)}</p>${external(sourceLink(p,e.find),'前往原文对应位置')}</details>`).join('')}</div>`;}
function findingPanel(p,index=0){const [title,desc]=p.visual_tabs[index];return `<strong>${title}</strong><p>${desc}</p>`;}
function paperPageLong(id){const p=paper(id);if(!p)return notFound();const illustration= id==='through'?'through-2':id==='debate'?'debate-5':p.cover;return `<div class="wrap page ${id}"><nav class="breadcrumb" aria-label="面包屑"><a href="#papers">论文阅读</a><span>/</span><span>${p.id==='debate'?'争议实例':p.type+' 典型实例'}</span></nav><header class="article-head">${typeLabel(id,p.id==='debate'?'分类争议':p.type+' · '+theory(id).zh)}<h1>${E(p.zh)}</h1><p class="english-title" lang="en">${E(p.title)}</p></header><div class="article-meta"><span>${E(p.authors)}</span><span>International Journal of Design ${E(p.volume)}, ${E(p.pages)}</span><span>${p.date}</span>${external('https://doi.org/'+p.doi,'DOI','caption-link')}</div><section class="article-intro"><h2>${E(p.research_question)}</h2><p>${E(p.background)}</p></section><div class="article-layout"><article class="article-main">${figure(illustration,'',false)}<section class="article-section"><h2>怎样形成研究证据？</h2><p>${E(p.method)}</p>${processDiagram(id)}${id==='through'?figure('through-3'):id==='debate'?figure('debate-1'):''}<p><strong>设计在这里的角色：</strong>${E(p.role)}</p></section><section class="article-section"><h2>研究贡献了什么？</h2><p>${E(p.contribution)}</p><div class="finding-tabs" role="group" aria-label="查看具体发现">${p.visual_tabs.map(([title],i)=>`<button data-finding="${i}" data-paper="${id}" aria-pressed="${i===0}">${title}</button>`).join('')}</div><div id="finding-panel" class="finding-panel" aria-live="polite">${findingPanel(p)}</div>${id==='for'?figure('for-1'):id==='through'?figure('through-11'):''}</section>${deepAnalysis(id)}<section class="judgment"><h2>${id==='debate'?'小组判断与保留意见':'为什么主要归为 '+p.type+'？'}</h2><p>${E(p.judgment)}</p><p>${E(p.counter)}</p></section><div class="limits"><section><h3>作者说明的局限</h3><p>${E(p.author_limit)}</p></section><section><h3>我们的分析边界</h3><p>${E(p.analytic_limit)}</p></section></div>${id==='through'?`<section class="rule-section"><h2>进入生活之后</h2><div class="article-gallery">${figure('through-10')}${figure('through-15')}</div></section>`:id==='debate'?`<section class="rule-section"><h2>从实际物件辨认设计活动</h2><div class="article-gallery">${figure('debate-4')}${figure('debate-7')}</div></section>`:''}</article><aside class="article-aside"><h2>原文依据</h2><p>对照分析与原文，区分作者报告的事实和本组的分类判断。</p>${evidenceSet(p)}</aside></div><nav class="article-next" aria-label="继续阅读">${routeLink('papers','返回论文集合')}${routeLink(id==='debate'?'challenge':'compare',id==='debate'?'重新参与分类讨论':'与其他论文对照')}</nav></div>`;}
let quiz={choice:'',reasons:[],submitted:false};
const options=[['into','Into','理解已有设计现象'],['for','For','支持后续设计决策'],['through','Through','通过设计介入形成知识'],['mixed','交叉取向','需要结合多个维度']];
const reasonChoices=[['object','研究对象是工人的设计活动'],['method','研究者主要观察、询问和分析'],['contribution','结果希望支持未来设备设计'],['making','研究中出现了制作和实物']];
function quizFeedback(){const p=paper('debate');const responses={
into:['Into 主导，是可以成立的判断。','若按主要证据与核心解释分类，观察、询问与实物分析支持 Into。还应承认设备设计支持是明确目标；是否标成交叉，取决于是否同时保留这一贡献维度。'],
for:['For 有目标依据，还需要权衡主要证据路径。','面向后续设备设计是明确目标，但本篇的主要分析仍在解释既有设计活动。可说明为何把设计支持置于首位，同时交代尚未验证后续改造效果。'],
through:['有制作，不足以证明本文采用 Through。','工人的改造是研究对象；本篇主要观察与分析已有物件。现有证据没有展示研究者通过设计介入、体验和反思来生成知识的路径。'],
mixed:['交叉判断成立的关键，是两个维度都能举证。','本组采用多维口径保留 Into × For：解释自发设计，同时明确支持设备设计。若按主导贡献给一个标签，Into 为主也有依据；交叉不是唯一标准答案。']};
const reasonText={object:['设计活动作为对象','支持 Into 的对象维度，但研究对象本身不能决定全部分类；还要检查研究者怎样分析它。','Introduction'],method:['观察、询问与分析','这是 Into 主导的重要依据。方法名称仍需与目的和贡献结合判断。','free non-participant observation'],contribution:['支持未来设备设计','支持 For 维度；其地位要结合研究目标与具体启示判断，不能把任何应用建议都算作独立取向。','inform the design of appropriate'],making:['制作和实物','先区分行动者：工人的制作行为不等于本文研究者以设计介入形成知识。','Methods']};
const [title,body]=responses[quiz.choice];return `<section class="quiz-result" id="quiz-result" tabindex="-1"><span class="step-caption">02 / 检查判断与证据</span><h3>${title}</h3><p>${body}</p>${quiz.reasons.map(id=>{const r=reasonText[id];return `<div class="reason-feedback"><strong>你选择的依据：${r[0]}</strong><p>${r[1]}</p>${external(sourceLink(p,r[2]),'核对原文')}</div>`;}).join('')}${quiz.reasons.length?'':'<p class="reason-feedback">你尚未选择依据。可重新判断，选择至少一条材料，再检查它如何支持你的结论。</p>'}<div class="reason-feedback"><strong>比较两种口径</strong><p>主要贡献：Into 为主。多维取向：Into × For。我们保留后者，也认可前者有条件成立。具体竞争依据见完整分析。</p></div>${routeLink('paper/debate','阅读两种判断与保留意见','button primary')}<button type="button" class="text-link" id="quiz-reset">重新判断 ↺</button></section>`;}
function challenge(){const p=paper('debate');return `<div class="wrap page">${pageHeader('同一篇研究，可以有两种有依据的归类吗？','阅读研究线索，选择一种判断与相应依据，再比较不同分类口径。重点是论证，而不是猜中标签。','分类讨论')}<div class="challenge-grid"><section class="challenge-material"><div>${figure('debate-5','clue-figure',false)}<p class="caption"><span lang="en">${E(p.title)}</span><br>Correia de Barros 等 · 2025</p></div><ol class="clue-list"><li><span>1</span><div><strong>工人在改造什么？</strong><p>为适应真实任务，工人改造工具与环境。研究记录了 11 家工业单位的 205 个自发设计实例。</p></div></li><li><span>2</span><div><strong>研究者实际做了什么？</strong><p>采用非参与观察、情境询问、照片与实物分析，整理已有的改造；与 14 位可确认的创造者交流。</p></div></li><li><span>3</span><div><strong>研究希望留下什么？</strong><p>解释自发设计的用途、行动与价值，并为后续更合适的工作设备设计提供依据。</p></div></li></ol></section><form class="quiz-panel" id="quiz-form"><span class="step-caption">01 / 作出你的判断</span><h2>这篇论文主要属于哪种取向？</h2><p>请依据研究问题、方法和贡献作答。可以选择交叉取向。</p><fieldset class="answer-options"><legend>选择研究取向</legend>${options.map(([id,title,desc])=>`<label class="answer-option"><input type="radio" name="classification" value="${id}" ${quiz.choice===id?'checked':''} ${quiz.submitted?'disabled':''}><span><strong>${title}</strong><small>${desc}</small></span></label>`).join('')}</fieldset><fieldset class="reason-options" ${quiz.submitted?'disabled':''}><legend>你看重哪些依据？ <small>可多选</small></legend>${reasonChoices.map(([id,label])=>`<label><input type="checkbox" name="reason" value="${id}" ${quiz.reasons.includes(id)?'checked':''}>${label}</label>`).join('')}</fieldset><div class="actions"><button type="submit" id="quiz-submit" class="button primary" ${!quiz.choice||quiz.submitted?'disabled':''}>提交判断，查看解释 <span aria-hidden="true">→</span></button></div><p class="selection-status" id="selection-status" role="status">${quiz.submitted?'已提交。请阅读下方对应解释。':quiz.choice?'已选择 '+options.find(o=>o[0]===quiz.choice)[1]+'，可以提交判断。':'请选择一个取向，再提交查看解释。'}</p><div id="quiz-feedback">${quiz.submitted?quizFeedback():''}</div></form></div><section class="rule-section"><div class="section-head"><h2>判断之前，先分清三件事</h2><p>这三问也适用于其他设计研究。</p></div><div class="evidence-columns"><article class="into"><h3>Who?</h3><p><strong>谁在设计？</strong><br>研究对象的制作活动与研究者的设计介入，可能是不同层面的事情。</p></article><article class="for"><h3>How?</h3><p><strong>知识怎样形成？</strong><br>看主要证据来自观察分析，还是设计、体验与反思的过程。</p></article><article class="through"><h3>What?</h3><p><strong>论文贡献了什么？</strong><br>区分解释、设计依据和实践生成的认识，并说明交叉发生在哪里。</p></article></div></section></div>`;}
function referenceBase(){return `<div class="wrap page">${pageHeader('每一项判断，都能回到来源','论文、课程与图像分别列出。论文分类和解释图属于本组分析；研究事实与原图应结合原文阅读。','参考文献')}<ol class="refs-list">${D.papers.map(p=>`<li><div><h2 lang="en">${E(p.cite)}</h2><p>正式发表：${p.date}。${p.id==='debate'?'用于分类争议讨论':'主要分析取向：'+p.type}。</p><div class="actions">${external(p.url,'论文全文')}${external('https://doi.org/'+p.doi,'DOI: '+p.doi)}${routeLink('paper/'+p.id,'查看分析')}</div></div></li>`).join('')}</ol><section class="rule-section"><div class="section-head"><h2>课程依据</h2></div><div class="reference-grid">${D.courses.filter(c=>c.id!=='venues').map(c=>`<article><h3>${E(c.title)}</h3><p>${E(c.summary)}</p>${external(c.url,'阅读课程原文')}</article>`).join('')}</div><p class="caption">在线文档以章节标题定位，不沿用旧导出文件的页码。</p></section><section class="rule-section"><h2>经典框架与术语辨析</h2><div class="reference-grid" style="margin-top:24px"><article><h3>Frayling, 1993/4</h3><p>Research in Art and Design。理解三类研究与实践的关系，并留意 For 在经典文本与本课程中的使用差异。</p>${external('https://arl.human.cornell.edu/879Readings/Frayling_Research%20through%20Design.pdf','课程提供的原文入口')}</article><article><h3>Gaver, 2012</h3><p>What Should We Expect from Research Through Design? 关注 RtD 知识的情境性、暂定性与面向可能性的特点。</p>${external('https://research.gold.ac.uk/14818/7/WHAT%20SHOULD%20WE%20EXPECT%20AAM.pdf','作者机构全文')}</article></div></section><section class="rule-section"><h2>图像来源与使用说明</h2><div class="asset-notes" style="margin-top:20px"><p>论文图像来自上述四篇论文的正式全文页面。四篇论文均声明采用 <a href="https://creativecommons.org/licenses/by/4.0/" target="_blank" rel="noopener noreferrer">CC BY 4.0</a> 许可。展示时保留原图内容与图号，按版面等比缩放；首页和列表中的部分实物图使用展示裁切，放大后显示完整原图。</p><p>课堂案例图沿用原网页内嵌的课堂材料，仅作为课程案例说明。关系图与“材料—分析—贡献”图由本组依据课堂和论文重新整理，不是论文原图，不表示经验证的因果模型。</p></div><table class="asset-table"><thead><tr><th>论文</th><th>使用图像</th><th>署名与来源</th></tr></thead><tbody>${D.papers.map(p=>`<tr><td>${p.id==='debate'?'争议实例':p.type}</td><td>${D.figures.filter(f=>f.paper===p.id).map(f=>f.position).join('、')}</td><td>${external(p.url,E(p.author_short)+'，2025' function criteriaBlock(){return `<section class="rule-section"><h2>我们怎样判断研究取向？</h2><div class="criteria-grid"><article><span>01 / 问题</span><h3>主要想知道什么？</h3><p>看研究目标，不按标题、关键词或单一方法贴标签。</p></article><article><span>02 / 证据</span><h3>怎样获得这种认识？</h3><p>区分研究对象的设计活动与本文研究者的行动，追踪材料如何被分析。</p></article><article><span>03 / 贡献</span><h3>读者最终能带走什么？</h3><p>比较解释、设计依据和实践生成的认识，找出论证的重心。</p></article></div><div class="judgment"><h3>主导取向与交叉取向</h3><p>主导取向看主要研究问题、证据路径与核心贡献是否共同指向一种目标。交叉取向则要求另一目标也有明确的研究意图与实质贡献；仅有一段应用建议，不足以自动增加一种类型。两种口径可以同时使用，但须说明采用哪一种。</p></div></section>`;}
function transferPanel(index){const t=transferNotes[index],p=paper(t.paper);return `<div class="transfer-heading"><span class="type-label ${t.from}">${theory(t.from).name} → ${theory(t.to).name}</span><span class="evidence-kind">${t.status}</span></div><h3>${t.label}</h3><div class="transfer-route"><div><small>从什么知识出发</small><strong>${t.input}</strong></div><span aria-hidden="true">→</span><div class="transfer-condition"><small>不能省略的转化</small><strong>${t.bridge}</strong></div><span aria-hidden="true">→</span><div><small>服务什么新的问题</small><strong>${t.output}</strong></div></div><p>${t.example}</p><p class="transfer-limit"><strong>边界：</strong>${t.limit}</p><div class="actions">${routeLink('paper/'+t.paper,'查看论文分析')}${external(sourceLink(p,t.find),'原文：'+t.loc)}</div>`;}
function relations(){const ids=['into','for','through'];return `<div class="wrap page">${pageHeader('设计知识与实践，如何相互联系？','Into 理解设计，For 支持设计，Through 在设计实践中形成认识。','研究关系图谱')}${subnav('relations')}<section class="relation-overview">${figure('relation-overview','overview-figure',false)}<p class="caption">图形表达参考课堂所列 2020、2021、2023 年往届作品对知识流动、研究产出与反馈的处理；本图按本次课程口径重新组织，不沿用其构图或将其作为分类标准。下方保留逐项关系说明与原文依据。</p></section><section class="knowledge-atlas" aria-labelledby="atlas-heading"><div class="section-head"><h2 id="atlas-heading">一、各自如何形成知识</h2><span class="small">横向箭头＝论证路径；三行之间没有先后顺序</span></div><div class="atlas-header"><span>研究取向</span><span>研究问题</span><span>研究行动</span><span>知识贡献与检查点</span></div>${laneData.map(([id,q,action,role,out,check])=>`<article class="atlas-lane ${id}"><a href="#paper/${id}" class="lane-name"><strong>${theory(id).name}</strong><span>${role}</span><small>查看论文 ↗</small></a><div class="lane-cell"><small>问题</small><h3>${q}</h3></div><div class="lane-cell"><small>行动与证据</small><h3>${action}</h3></div><div class="lane-cell lane-output"><small>贡献</small><h3>${out}</h3><p>${check}。</p></div></article>`).join('')}<p class="caption">图中列出的是可选的证据形成方式，不是每类研究唯一的方法，也不是项目执行的固定步骤。</p></section><section class="rule-section"><div class="section-head"><div><h2>二、知识怎样跨越取向</h2><p>从左侧行读出发点，从上方列读去向。选择一个箭头，查看转化条件与论文依据。</p></div></div><div class="transfer-matrix" role="group" aria-label="六个知识转化方向"><div class="matrix-corner">出发 ↓　去向 →</div>${ids.map(id=>`<div class="matrix-label ${id}">${theory(id).name}</div>`).join('')}${ids.map(from=>`<div class="matrix-label ${from}">${theory(from).name}</div>${ids.map(to=>{const i=transferNotes.findIndex(t=>t.from===from&&t.to===to);return i<0?`<div class="matrix-self"><span>内部深化</span><small>不必跨类，仍可贡献知识</small></div>`:`<button data-transfer="${i}" aria-pressed="${i===0}" aria-controls="transfer-detail"><span>${theory(from).name} → ${theory(to).name}</span><strong>${transferNotes[i].label}</strong></button>`;}).join('')}`).join('')}</div><article id="transfer-detail" class="transfer-detail" aria-live="polite">${transferPanel(0)}</article><p class="caption">六个箭头是本组对可能联系的分析。所选四篇论文并未构成一个连续研究计划，也未实证验证完整的六向网络。上方逐项标明已有依据与后续可能。</p></section><section class="rule-section"><h2>三、关系存在，不等于分类相同</h2><div class="overlap-grid"><article><span class="kicker">贡献可以延伸</span><h3>Into 为主，也可以启发设计</h3><p>理论使用论文主要解释实践；教育启示属于延展价值。不能因为知识将来能被使用，就把所有 Into 都改成 For。</p>${routeLink('paper/into','看主导取向的判断')}</article><article><span class="kicker">目标可以交叉</span><h3>Into 的解释路径 × For 的明确目标</h3><p>车间研究既解释自发设计，也明确希望支持设备设计。采用主导口径可说 Into 为主；采用多维口径可保留 Into × For。</p>${routeLink('paper/debate','看两种判断的竞争依据')}</article><article><span class="kicker">过程可以生成多种贡献</span><h3>Through 的认识也能形成设计依据</h3><p>AnimaTo 的设计介入带来情境化认识，又提出后续设计考虑。贡献跨向其他取向，不会抹去本篇的实践探究路径。</p>${routeLink('paper/through','看设计介入与知识的关系')}</article></div></section>${criteriaBlock()}<section class="rule-section"><h2>从四篇论文得到的结论</h2><p class="conclusion-copy">三种类型更适合用来追问研究，而不是把论文放进互不相通的盒子。我们以问题、证据和贡献判断主导取向；遇到交叉时，再区分行动者、分析层级与知识用途。分类的价值，是把研究怎样产生知识说得更清楚。</p>${external(D.courses.find(c=>c.id==='c24').url,'课堂依据：三种设计研究的关系')}</section></div>`;}

function deepAnalysis(id){const p=paper(id);let body='';
 if(id==='into')body=`<h2>从访谈实例到知识：理论究竟怎样被使用？</h2>${evidenceRows([
 ['借助与组合：不必先改变理论','Bob 将文献中的概念视为可用于构建设计理解的材料；Olivia 提及同时使用社会心理学模型与 Dewey 的建构主义传统。','这些材料支撑“借助”和“组合”的实践解释。关键不是出现了多少理论名称，而是研究者怎样处理已有概念之间的关系。','Results → Building or Combining with Theory as Design-Material'],
 ['转用：理论的用途发生改变','Owen 谈到把原本开放、可多重解释的概念转为让学生评价体验的问卷；明确化也可能减少其生成性。','这是理论用途改变及其代价的具体材料，支持“转用”的解释。并非宣布转用总比借助更先进。','Results → Improving and Transitioning Theory as Design Material']
 ])}<p>本文的研究行动是对这些回顾性叙述编码和主题分析，再把实践概念化。受访者的项目可以采用 RtD；分析这些项目的本篇论文主要回答“设计研究者怎样使用理论”，两者处在不同分析层级。</p><p class="caption">作者的 Table 2 汇总四种实践；其后明确说明，没有数据展示四种实践在一个项目中的展开。不能将上述实例拼成一条虚构的四步迭代。</p>`;
 if(id==='for')body=`<h2>三种证据怎样支持设计原则？</h2>${evidenceRows([
 ['展览：顺序、强度与情境线索','气味盒展览采用质性观察。儿童对气味的判断受先前刺激与盒子颜色影响，并非只由气味本身决定。','设计者需要编排刺激而非随意叠加。顺序、强度和跨感官线索应一起考虑；这不是对所有儿童给出同一浓度或同一序列。','Empirical Insights → Study 1: Story Exhibition'],
 ['家庭共读：为解释与交流留出时间','十个挪威家庭使用刮闻书；亲子言语与行为分析呈现讨论、记忆联想和不同解释。','逐页闻嗅与阅读的间隔为交流提供空间，支持节奏作为设计考虑。但质性观察不能单独证明一个普遍最优间隔。','Study 2: Empirical Evaluation of Reading Scratch and Sniff Books'],
 ['数字故事：参与不等于学习提升','第三项采用实验方法，在幼儿园情境中使用数字故事与气味罐；参与度提高未伴随词汇学习或故事回忆改善。','设计应区分参与目标与学习目标。一致性原则还结合理论和相关文献，需在具体应用中预试，不能称作已验证的普遍学习方案。','Study 3: Experimental Investigation of eBook Enhanced with Olfactory Stimuli']
 ])}<aside class="reading-note"><strong>从原则到决定：以“节奏”为例</strong><p>若每翻一页都触发新气味，设计者应检查前一个刺激是否消散、孩子是否有时间讨论，再决定是否减少触发次数或设置阅读间隔。这说明原则如何改变设计决定，不是作者报告过的新实验。</p></aside><p>三项研究与四项原则并非一一对应；作者将不同经验与理论共同综合。主要贡献是支持未来设计判断，而不是把三项研究合并成一次实验。</p>`;
 if(id==='through')body=`<h2>设计介入怎样转化为认识？</h2>${evidenceRows([
 ['设计意图：熟悉的用途作为入口','前期工作完成 AnimaTo 的材料与形态探索。本篇以茶巾进入家庭，通过收缩和展开引出新的动作及使用可能。','熟悉用途有助于进入日常，也建立了功能期待。设计选择因此参与塑造研究情境，不只是展示一个对象。','Introduction；Field Study → Design Rationale'],
 ['实际遭遇：变化并不总带来新用途','家庭中的展开程度不同；体验出现好奇、困惑、功能冲突，也出现规避、停用或另找用途。','功能偏差不是应被删去的失败数据。它让作者重新考察开放性、功能期待与用途挪用之间的张力。','Results → Summary of Findings；Figure 11'],
 ['认识与延展：保留变化中的张力','讨论从功能、时间性、材料性组织结果，并提出引导功能转换、调整变化节奏等考虑。','研究贡献包含对材料体验的情境化认识，以及跨时间考察这种体验的方法。后续设计考虑可服务 For，但尚非通用处方。','Discussion；Conclusion']
 ])}<p>本组将它主要归为 Through，是因为被设计的变化使问题能够被经历，分析又返回这些设计选择的后果。仅仅“没有这个制品就无法做实验”并不足以归类；还须说明实践与认识之间的往返。</p><p class="caption">时间边界：制作基础见 Buso 等的 2024 年工作；所选 2025 年论文重点报告家庭部署及体验分析。前期制作与本篇部署属于相连的研究阶段，贡献需分别判断。</p>`;
 if(id==='debate')body=`<h2>为什么这是一项设计研究？</h2><p>对象是工人围绕任务改造物件与工作环境的设计活动；方法通过系统观察、情境询问、实物分析和亲和图组织证据；贡献超出物件清单，形成对用途、行动和价值的解释，并指向工业设备设计。设计研究身份由这条论证支持，而非仅由发表期刊或照片中的手工物件决定。</p><h2 class="spaced-title">两种判断，争议在哪里？</h2>${evidenceRows([
 ['判断 A：Into 主导，For 是应用意义','Methods 以非参与观察和分析为主要路径；Discussion / Table 5 概念化已有的自发设计。','采用主要知识贡献口径，Into 主导有充分依据。尚未实施和验证后续设备再设计，也限制了对 For 成效的断言。','Methods；Discussion；Table 5'],
 ['判断 B：Into × For，保留双重目标','Introduction 明确连接理解自发设计与支持未来设备设计；Conclusion 将实物分析联系到设计实践与用户研究。','采用多维口径，解释与设计支持都可保留。但不能由此宣称两者权重相等，更不能把未验证的设计启示称作有效方案。','Introduction；Conclusion']
 ])}<aside class="reading-note"><strong>为什么不是所有带“设计启示”的论文都归交叉？</strong><p>我们同时检查目标、证据组织和贡献。理论使用论文明确以理解实践而非规定用法为重，教育应用是延展；车间研究在研究目标中就包含设备设计支持。差别在论证中的地位，不在于是否出现“启示”一词。若坚持只给一个主标签，两篇都可判断为 Into 主导。</p></aside><p><strong>本组立场：</strong>采用多维口径，保留 Into × For；采用主导口径时承认 Into 为主。我们没有证据把本篇视为由研究者组织设计介入来产生知识的 Through。工人的制作与本文研究者的方法不能混为一谈。</p>`;
 return `<section class="article-section deep-analysis">${body}${external(p.url,'对照论文全文')}</section>`;
}

function figureAnalysis(key){const a=visualAnalyses[key];if(!a)return '';const f=asset(key),p=paper(f.paper);return `<section class="figure-reading" aria-label="${E(f.position)} 图文分析"><h3>${a.question}</h3><div class="figure-observations">${a.parts.map(([where,seen,meaning])=>`<article><h4>${where}</h4><p><strong>观察：</strong>${seen}</p><p><strong>分析：</strong>${meaning}</p></article>`).join('')}</div><p class="figure-argument"><strong>对研究判断的作用</strong>${a.takeaway}</p><p class="figure-boundary"><strong>证据边界：</strong>${a.boundary}</p>${external(sourceLink(p,a.find),'核对：'+a.loc,'text-link')}</section>`;}


function references(){
 const base=referenceBase();
 const register=`<section class="rule-section source-register"><h2>分析与原文位置</h2><p>正文中的分析、图文解读和分类判断，在此集中对应论文原文。</p>${D.papers.map(p=>`<section class="reference-paper"><h3>${E(p.short)}</h3>${evidenceSet(p)}${Object.entries(visualAnalyses).filter(([key])=>asset(key).paper===p.id).map(([key,a])=>`<details><summary>图文分析 · ${E(asset(key).position)}</summary><p>${E(a.question)}</p><p>${E(a.loc)}</p>${external(sourceLink(p,a.find),'核对原文')}</details>`).join('')}</section>`).join('')}</section>
 <section class="rule-section"><h2>关系图的表达与参考</h2><p>总图以“设计知识”和“设计实践”两个区域表达联系：Into 从设计实践中形成解释，For 以知识支持设计，Through 以制作、体验和反思生成认识。箭头表示知识联系，不表示三类研究必须依次发生。Through 的小环表示反复探究，不是固定的方法步骤。</p><p>构图由本组重新绘制；表达方式参考课程关系章节所收录往届作品对知识流动、实践与反思的处理。关系图用于概念说明，不是经验验证的因果模型。</p><div class="evidence-set">${transferNotes.map(t=>`<details><summary>${theory(t.from).name} → ${theory(t.to).name}</summary><p>${E(t.status)}</p><p>${E(t.loc)}</p><p>${E(t.limit)}</p>${external(sourceLink(paper(t.paper),t.find),'查看对应论文')}</details>`).join('')}</div></section>
 <section class="rule-section"><h2>逐图信息</h2><div class="evidence-set">${D.figures.map(f=>`<details><summary>${E(f.title)}</summary><p>${E(f.credit)} · ${E(f.position)}</p>${external(f.source,'图像出处')}</details>`).join('')}</div></section>`;
 return base.slice(0,-6)+register+'</div>';
}
function cleanReadingSurface(){
 if(location.hash==='#references')return;
 const root=$('#main');
 $$('.caption, figcaption, .article-aside, .article-meta, .compare-cell .evidence, .evidence-kind',root).forEach(e=>e.remove());
 const walker=document.createTreeWalker(root,NodeFilter.SHOW_TEXT);let node;
 while(node=walker.nextNode()){
  node.nodeValue=node.nodeValue.replace(/请依据/g,'请结合').replace(/只依据/g,'只凭').replace(/设计依据/g,'设计支撑').replace(/哪些依据/g,'哪些理由').replace(/选择的依据/g,'选择的理由').replace(/选择依据/g,'选择理由').replace(/相应依据/g,'相应理由').replace(/竞争依据/g,'判断理由').replace(/论文依据/g,'论文分析').replace(/目标依据/g,'目标支持').replace(/依据成为/g,'原则成为').replace(/检验依据/g,'检验设计原则').replace(/转译和检验依据/g,'转译和检验原则').replace(/检查依据/g,'检查原则').replace(/评价依据/g,'评价标准').replace(/依据/g,'支撑');
 }
}
for(const eventName of ['click','change','submit'])document.addEventListener(eventName,()=>cleanReadingSurface());


const paperTabs=['问题与方法','设计与贡献','图文解读','论证展开','归类与局限'];
const paperReadingState={};
function paperPage(id){
 if(!paper(id))return notFound();
 const temp=document.createElement('template');temp.innerHTML=paperPageLong(id);
 const root=temp.content.firstElementChild,body=root.querySelector('.article-main');
 const panels=paperTabs.map((label,i)=>{const el=document.createElement('section');el.className='paper-panel article-main';el.id='paper-panel-'+i;el.setAttribute('role','tabpanel');el.setAttribute('aria-labelledby','paper-tab-'+i);el.tabIndex=0;return el;});
 const figures=[...body.querySelectorAll('figure')];
 const slides=figures.map((fig,i)=>{const slide=document.createElement('section');slide.className='reading-slide';slide.dataset.slide=i;slide.hidden=i!==0;
 const analysis=fig.nextElementSibling?.matches('.figure-reading')?fig.nextElementSibling:null;
 slide.append(fig);if(analysis)slide.append(analysis);return slide;});
 const gallery=document.createElement('div');gallery.className='reading-gallery';
 gallery.innerHTML=`<div class="figure-switcher" role="group" aria-label="选择解读图片">${figures.map((f,i)=>`<button type="button" data-reading-figure="${i}" aria-pressed="${i===0}">${i+1} · ${E(asset(f.querySelector('[data-zoom]').dataset.zoom).title)}</button>`).join('')}</div><div class="reading-slide-area"></div>`;
 slides.forEach(slide=>gallery.querySelector('.reading-slide-area').append(slide));panels[2].append(gallery);
 panels[0].append(root.querySelector('.article-intro'));
 const sections=[...body.children];
 for(const el of sections){
  if(el.matches('.deep-analysis'))panels[3].append(el);
  else if(el.matches('.judgment,.limits'))panels[4].append(el);
  else if(el.matches('.article-section'))panels[el.querySelector('h2')?.textContent==='研究贡献了什么？'?1:0].append(el);
 }
 const reader=document.createElement('div');reader.className='paper-reader';
 const active=paperReadingState[id]||0;
 reader.innerHTML=`<div class="paper-tabbar" role="tablist" aria-label="论文阅读分区">${paperTabs.map((label,i)=>`<button type="button" role="tab" id="paper-tab-${i}" aria-controls="paper-panel-${i}" aria-selected="${i===active}" tabindex="${i===active?0:-1}" data-paper-tab="${i}" data-paper-id="${id}">${label}</button>`).join('')}</div>`;
 panels.forEach((el,i)=>{el.hidden=i!==active;reader.append(el);});
 reader.insertAdjacentHTML('beforeend',`<nav class="paper-stepper" aria-label="顺序阅读"><button type="button" data-paper-step="-1">← 上一部分</button><span id="paper-progress" aria-live="polite">${active+1} / 5</span><button type="button" data-paper-step="1">下一部分 →</button></nav>`);
 root.querySelector('.article-layout').replaceWith(reader);
 reader.querySelector('[data-paper-step="-1"]').disabled=active===0;reader.querySelector('[data-paper-step="1"]').disabled=active===4;
 return root.outerHTML;
}
function switchPaperTab(index,focus=false){
 const tabs=$$('[data-paper-tab]');if(!tabs.length)return;
 index=Math.max(0,Math.min(index,tabs.length-1));paperReadingState[tabs[0].dataset.paperId]=index;
 tabs.forEach((t,i)=>{t.setAttribute('aria-selected',String(i===index));t.tabIndex=i===index?0:-1;});
 $$('.paper-panel').forEach((p,i)=>p.hidden=i!==index);
 $('#paper-progress').textContent=(index+1)+' / 5';$('[data-paper-step="-1"]').disabled=index===0;$('[data-paper-step="1"]').disabled=index===4;
 if(focus)tabs[index].focus({preventScroll:true});
 const bar=$('.paper-tabbar');if(bar.getBoundingClientRect().top<$('.site-header').offsetHeight)bar.scrollIntoView({block:'start',behavior:'instant'});
}
document.addEventListener('click',event=>{
 const tab=event.target.closest('[data-paper-tab]');if(tab)switchPaperTab(Number(tab.dataset.paperTab));
 const step=event.target.closest('[data-paper-step]');if(step){const active=Number($('[data-paper-tab][aria-selected="true"]').dataset.paperTab);switchPaperTab(active+Number(step.dataset.paperStep),true);}
 const fig=event.target.closest('[data-reading-figure]');if(fig){$$('[data-reading-figure]').forEach(b=>b.setAttribute('aria-pressed',String(b===fig)));$$('.reading-slide').forEach((s,i)=>s.hidden=i!==Number(fig.dataset.readingFigure));}
});
document.addEventListener('keydown',event=>{
 const tab=event.target.closest('[data-paper-tab]');if(!tab)return;
 let index=Number(tab.dataset.paperTab);
 if(event.key==='ArrowRight')index=(index+1)%5;else if(event.key==='ArrowLeft')index=(index+4)%5;else if(event.key==='Home')index=0;else if(event.key==='End')index=4;else return;
 event.preventDefault();switchPaperTab(index,true);
});

window.addEventListener('hashchange',render);render();
</script>
